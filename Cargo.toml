[package]
name = "primer3-py-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "primer3_py_rs"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3 = "0.27.2"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "hairpin"
harness = false

[[bench]]
name = "heterodimer"
harness = false
