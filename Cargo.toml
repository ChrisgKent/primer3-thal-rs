[package]
name = "primer3-py-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "primer3_py_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.2", optional = true }
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
python = ["dep:pyo3", "parallel"]

[dev-dependencies]
criterion = "0.5"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "hairpin"
harness = false

[[bench]]
name = "heterodimer"
harness = false

[[bench]]
name = "batch"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
