[package]
name = "primer3-py-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "primer3_py_rs"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3 = "0.27.2"

[dev-dependencies]
criterion = "0.5"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }

[[bench]]
name = "hairpin"
harness = false
