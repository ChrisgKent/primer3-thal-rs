[package]
name = "primer3-thal-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LLM transpilation of primer3-py v2.3.0's thal to Rust: hairpin, homodimer and heterodimer ΔG/Tm for DNA oligos"
license = "GPL-2.0-or-later"
repository = "https://github.com/ChrisgKent/primer3-thal-rs"
readme = "README.md"
keywords = ["primer3", "pcr", "primer", "thermodynamics", "dna"]
categories = ["science::bioinformatics"]
# Only what's needed to build: the fixtures (~6 MB) and the primer3-py
# submodule stay in the repository.
include = [
    "/src/**/*.rs",
    "/primer3_config/*",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = false
features = ["parallel"]

[lib]
name = "primer3_thal_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.2", optional = true }
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
python = ["dep:pyo3", "parallel"]

[dev-dependencies]
criterion = "0.5"
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "hairpin"
harness = false

[[bench]]
name = "heterodimer"
harness = false

[[bench]]
name = "batch"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
