[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "primer3_thal_rs"
description = "LLM transpilation of primer3-py v2.3.0's thal to Rust: hairpin, homodimer and heterodimer ΔG/Tm"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# Reference implementation, used to generate and check test fixtures.
test = ["primer3-py==2.3.0"]

[project.urls]
Repository = "https://github.com/ChrisgKent/primer3-thal-rs"

[tool.maturin]
bindings = "pyo3"
features = ["python", "pyo3/extension-module"]
module-name = "primer3_thal_rs"
